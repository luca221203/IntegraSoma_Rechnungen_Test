  --bg:#F6F4EC; --surface:#FFFCF5; --raised:#FFFFFF; --ink:#1E2320; --muted:#666F63;
  --line:#DDE0D5; --sage:#80927A; --sage-strong:#5E6F58; --sage-wash:#E9EDE5;
  --wine:#711322; --wine-wash:#F5E7E9; --copper:#B6875B; --focus:#711322;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161916; --surface:#1D211D; --raised:#232823; --ink:#ECEDE6; --muted:#A2A99E;
    --line:#353B34; --sage:#93A58C; --sage-strong:#B6C6AF; --sage-wash:#283027;
    --wine:#E08C9A; --wine-wash:#3A2226; --copper:#C99C74; --focus:#E08C9A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161916; --surface:#1D211D; --raised:#232823; --ink:#ECEDE6; --muted:#A2A99E;
  --line:#353B34; --sage:#93A58C; --sage-strong:#B6C6AF; --sage-wash:#283027;
  --wine:#E08C9A; --wine-wash:#3A2226; --copper:#C99C74; --focus:#E08C9A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:28px 18px 22px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand img{width:100%;max-width:190px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:400;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--sage-wash);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sage-wash);color:var(--sage-strong);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .count{font-size:12px;background:var(--wine);color:#FFFCF5;border-radius:10px;padding:0 7px;line-height:19px;font-weight:500}
.nav .new{margin-top:10px;background:var(--sage);color:#FFFCF5;justify-content:center;font-weight:500}
.nav .new:hover,.nav .new[aria-current="page"]{background:var(--sage-strong);color:#FFFCF5}
.backup{margin-top:auto;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.backup strong{font-weight:500;color:var(--ink)}
.backup.warn strong{color:var(--wine)}
.backup button{margin-top:8px}
.backup.warn{color:var(--wine)}

main{padding:36px 44px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
h1{font-weight:400;font-size:28px;line-height:1.2;margin:0;letter-spacing:-.2px}
h2{font-weight:500;font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:6px 0 0}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:400;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:#FFFCF5;font-weight:500}
.btn.primary:hover{background:var(--sage-strong);border-color:var(--sage-strong)}
.btn.danger{color:var(--wine)}
.btn.danger:hover{border-color:var(--wine)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.link{border:none;background:none;padding:4px 6px;color:var(--sage-strong);font-weight:500}
.btn.link:hover{text-decoration:underline}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.stack{display:flex;flex-direction:column;gap:22px}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:28px}
.summary div{padding:18px 22px;border-right:1px solid var(--line)}
.summary div:last-child{border-right:none}
.summary .v{font-size:24px;font-weight:400;display:block;line-height:1.3}
.summary .l{color:var(--muted);font-size:13.5px}
.summary .alert .v{color:var(--wine)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:none}
table.list .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.list .nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.empty{padding:34px 22px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}

.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-offen{background:var(--sage-wash);color:var(--sage-strong)}
.b-ueberfaellig{background:var(--wine-wash);color:var(--wine)}
.b-bezahlt{background:transparent;color:var(--muted);border:1px solid var(--line)}
.b-storniert,.b-storno{background:transparent;color:var(--muted);border:1px dashed var(--line)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--sage-wash);color:var(--sage-strong);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.search{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 12px;min-width:220px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:400}
label.f input,label.f select,label.f textarea,.pos input,.pos select{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 10px;font-size:14.5px;color:var(--ink);width:100%;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.span2{grid-column:span 2}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* Neue Rechnung */
.compose{display:grid;grid-template-columns:minmax(380px,1fr) minmax(320px,520px);gap:32px;align-items:start}
.desk{position:sticky;top:24px;background:var(--sage-wash);border-radius:14px;padding:22px}
.desk .cap{font-size:13px;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between}
.pos-list{display:flex;flex-direction:column;gap:10px}
.pos{display:grid;grid-template-columns:minmax(0,1.1fr) 76px minmax(0,1fr) 34px;gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.pos .full{grid-column:1 / -1}.pos .w3{grid-column:1 / 4}
.pos small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.x{all:unset;cursor:pointer;width:34px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:18px}
.x:hover{background:var(--wine-wash);color:var(--wine)}
.x:focus-visible{outline:2px solid var(--focus)}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-variant-numeric:tabular-nums;margin-top:6px}
.totals .g{font-weight:500;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.err{color:var(--wine);font-size:13.5px;margin:10px 0 0;min-height:1em}

/* A4-Dokument */
.paper{position:relative;width:100%;aspect-ratio:595/842;overflow:hidden;box-shadow:0 1px 2px rgba(30,35,32,.08),0 12px 30px -12px rgba(30,35,32,.25);border-radius:2px;background:#FFFCF5}
.paper > .page{position:absolute;left:0;top:0;transform-origin:0 0}
.page{width:595pt;height:842pt;position:relative;background:#FFFCF5;color:#000;font-family:'Poppins',sans-serif;font-weight:300;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page .pg-logo{position:absolute;left:48.6pt;top:56.5pt;width:225pt;height:60pt}
.page .pg-foot{position:absolute;top:742pt;font-size:8pt;line-height:12pt;white-space:nowrap}
.page .pg-bar{position:absolute;left:0;right:0;top:822pt;height:20pt;background:#80927A}
.page .pg-body{position:absolute;left:51.8pt;top:166pt;width:480.7pt;font-size:11pt;line-height:17pt}
.page .pg-title{text-align:center;font-weight:500;font-size:13pt;letter-spacing:1.3pt;margin:0 0 30pt}
.page .pg-head{display:grid;grid-template-columns:55% 45%;margin-bottom:30pt}
.page p{margin:0}
.page .m{font-weight:500}
.page .gap{height:17pt}
.page table.pg-table{width:100%;border-collapse:collapse;font-size:10.5pt;line-height:15pt;table-layout:fixed}
.page .pg-table th,.page .pg-table td{border:.5pt solid #80927A;padding:3.5pt 6pt;text-align:left;font-weight:300;overflow-wrap:anywhere}
.page .pg-table th{background:#80927A;color:#FFFCF5;font-weight:500}
.page .pg-table .r{text-align:right;white-space:nowrap}
.page .pg-table tr.sum td{border-top:1.2pt solid #80927A}
.page .pg-table tr.total td{border-top:1.2pt solid #80927A;font-weight:500}
.page .pg-pay{margin-top:30pt}
.page .ph{color:#9AA394}

dialog{border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.45)}
dialog.wide{max-width:min(760px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(22,25,22,.45)}
dialog form,dialog .dlg{padding:24px}
dialog h2{font-size:19px;font-weight:500;margin:0 0 6px}
dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
dialog .doc{max-width:520px;margin:16px auto 0}

.note{background:var(--wine-wash);color:var(--wine);border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#print-root{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#FFFCF5!important;margin:0;padding:0;height:auto}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .page{break-after:avoid;page-break-after:avoid}
}

@media (max-width:1100px){.compose{grid-template-columns:1fr}.desk{position:static;max-width:560px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px;padding:16px}
  .brand img{max-width:150px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav .new{margin-top:0}
  .backup{margin-top:0;border-top:none;padding-top:0;width:100%}
  main{padding:24px 18px 48px}
  .summary{grid-template-columns:1fr}
  .summary div{border-right:none;border-bottom:1px solid var(--line)}
  .grid2,.grid3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .pos{grid-template-columns:1fr 1fr}.pos .w3{grid-column:1 / 2}
}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img id="brandLogo" alt=""></div>
    <nav class="nav" id="nav" aria-label="Bereiche">
      <button data-view="start">Übersicht</button>
      <button data-view="rechnungen">Rechnungen <span class="count" id="navOverdue" hidden></span></button>
      <button data-view="kunden">Kunden</button>
      <button data-view="leistungen">Leistungen</button>
      <button data-view="einstellungen">Einstellungen</button>
      <button data-view="neu" class="new">Neue Rechnung</button>
    </nav>
    <div class="backup" id="backupBox"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-root"></div>

<script>
'use strict';
const CFG = window.APP_CONFIG;
const LOGO = CFG.logo;
const KEY = CFG.storageKey;
document.title = CFG.appName;

/* ---------- Daten ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function defaults(){
  return {
    settings:Object.assign({}, CFG.settings),
    kunden:[],
    leistungen:(CFG.leistungen||[]).map(l => ({id:uid(), name:l.name, netto:l.netto})),
    rechnungen:[],
    counters:{},
    lastBackup:null
  };
}
let S, storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw), base = defaults();
      S = Object.assign(base, d);
      S.settings = Object.assign(defaults().settings, d.settings || {});
    } else S = defaults();
  }catch(e){ storageOK = false; S = defaults(); }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function save(){ persist(); scheduleAuto(); renderSide(); }

/* ---------- Helfer ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const eur = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function num(v){
  if(typeof v === 'number') return v;
  let s = String(v||'').trim().replace(/\s|€/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
const numIn = n => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d+Number(n)); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function dShort(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y.slice(2); }
function dLong(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function kundeName(k){ return [k.vorname,k.nachname].filter(Boolean).join(' ') || k.firma || 'Ohne Namen'; }
function totals(pos, mwst, sign=1){
  const net = r2(pos.reduce((a,p)=>a + num(p.menge||1)*num(p.netto), 0)) * sign;
  const vat = r2(net * mwst / 100);
  return {net, vat, total:r2(net+vat)};
}
function numberKey(iso){ const [y,m]=iso.split('-'); return m+'/'+y; }
function peekNumber(iso){ const k=numberKey(iso); return k+' - '+((S.counters[k]||0)+1); }
function takeNumber(iso){ const k=numberKey(iso); S.counters[k]=(S.counters[k]||0)+1; return k+' - '+S.counters[k]; }
function dueDate(r){
  if(r.mahnungen && r.mahnungen.length) return addDays(r.mahnungen[r.mahnungen.length-1], S.settings.mahnfrist);
  return addDays(r.datum, r.zahlungsziel);
}
function status(r){
  if(r.typ==='storno') return 'storno';
  if(r.status==='storniert') return 'storniert';
  if(r.status==='bezahlt') return 'bezahlt';
  return today() > dueDate(r) ? 'ueberfaellig' : 'offen';
}
const STATUS_TXT = {offen:'Offen', ueberfaellig:'Überfällig', bezahlt:'Bezahlt', storniert:'Storniert', storno:'Stornorechnung'};
const badge = s => `<span class="badge b-${s}">${STATUS_TXT[s]}</span>`;
function anredeZeile(k){
  const n = k.nachname || kundeName(k);
  if(k.anrede==='Herr') return `Sehr geehrter Herr ${n},`;
  if(k.anrede==='Frau') return `Sehr geehrte Frau ${n},`;
  return `Guten Tag ${kundeName(k)},`;
}

/* ---------- Dokument (A4) ---------- */
function docHTML(o){
  const st = o.settings || S.settings, k = o.kunde || {};
  const hasK = !!(k.nachname || k.vorname || k.firma);
  const ph = p => (o.preview && !hasK) ? `<span class="ph">${esc(p)}</span>` : '';
  const lines = [
    k.anrede && k.anrede!=='–' ? esc(k.anrede) : ph('Herr / Frau'),
    k.firma ? esc(k.firma) : '',
    (k.nachname || k.vorname) ? esc(kundeName(k)) : ph('Vorname Nachname'),
    k.strasse ? esc(k.strasse) : ph('Straße Nr.'),
    k.plzort ? esc(k.plzort) : ph('PLZ Ort'),
    k.land ? esc(k.land) : ''
  ].filter(Boolean);
  const adr = lines.map(x => `<p>${x}</p>`).join('');
  const angaben = o.angaben.map(([l,v],i) => i===0 ? `<p class="m">${esc(l)}</p>` : `<p>${esc(l)}: ${esc(v)}</p>`).join('');
  let middle = '';
  if(o.positionen){
    const sign = o.sign || 1;
    const rows = o.positionen.map(p => {
      const m = num(p.menge||1);
      const txt = (m!==1 ? (m.toLocaleString('de-DE')+' × ') : '') + (p.text||'');
      return `<tr><td>${esc(txt)}</td><td>${esc(dShort(p.datum))}</td><td class="r">${eur(sign*m*num(p.netto))}</td></tr>`;
    }).join('');
    const t = totals(o.positionen, o.mwst, sign);
    middle = `
    <table class="pg-table"><colgroup><col style="width:50%"><col style="width:22%"><col style="width:28%"></colgroup>
      <thead><tr><th>Leistung</th><th>Datum</th><th class="r">Betrag</th></tr></thead>

let view = 'start';
function renderSide(){
  $$('#nav button').forEach(b => b.toggleAttribute('aria-current', false));
  const cur = $(`#nav button[data-view="${view}"]`); if(cur) cur.setAttribute('aria-current','page');
  const od = S.rechnungen.filter(r => status(r)==='ueberfaellig').length;
  const c = $('#navOverdue'); c.hidden = !od; c.textContent = od; c.title = od + ' überfällig';
  const box = $('#backupBox');
  const lb = S.lastBackup;
  const old = !lb || (Date.now() - new Date(lb).getTime()) > 14*864e5;
  let html = storageOK ? '' : '<p style="color:var(--wine);margin:0 0 8px">Ihr Browser speichert hier nichts dauerhaft. Bitte nach jeder Sitzung eine Sicherung herunterladen.</p>';
  let warn = false;
  if(autoState==='on'){
    html += `Automatische Sicherung aktiv<br><span>zuletzt: <strong>${S.lastAutoBackup ? whenTxt(S.lastAutoBackup) : 'gleich'}</strong></span>`;
  } else if(autoState==='needs-permission'){
    warn = true;
    html += `<strong>Automatische Sicherung pausiert.</strong><br>Chrome braucht einmal Ihre Bestätigung.<br><button class="btn small primary" data-act="auto-resume">Sicherung freigeben</button>`;
  } else if(autoState==='error'){
    warn = true;
    html += `<strong>Sicherungsordner nicht erreichbar.</strong><br><button class="btn small" data-act="auto-choose">Ordner neu wählen</button>`;
  } else {
    warn = old && S.rechnungen.length > 0;
    html += `Letzte Sicherung: <strong>${lb ? dLong(lb.slice(0,10)) : 'noch keine'}</strong><br>`
      + (autoState==='off' ? `<button class="btn small primary" data-act="auto-choose">Automatisch sichern</button> ` : '')
      + `<button class="btn small" data-act="backup">Sicherung herunterladen</button>`;
  }
  box.className = 'backup' + (warn ? ' warn' : '');
  box.innerHTML = html;
}
function whenTxt(iso){
  const d = new Date(iso), t = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return iso.slice(0,10)===today() ? 'heute ' + t : dLong(iso.slice(0,10)) + ' ' + t;
}

  else draft.positionen = [{leistungId:'', text:'', netto:'', menge:1, datum:d}];

      <label class="f"><small>Datum der Leistung</small><input type="date" data-f="datum" value="${p.datum||''}"></label>
      <label class="f"><small>Anzahl</small><input data-f="menge" inputmode="decimal" value="${esc(String(p.menge??1).replace('.',','))}"></label>
      <label class="f"><small>Preis netto</small><input data-f="netto" inputmode="decimal" value="${p.netto===''?'':esc(numIn(p.netto))}"></label>
    </div>`).join('');
  $$('#posList .pos').forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelectorAll('[data-f]').forEach(inp => {
      const ev = inp.tagName==='SELECT' || inp.type==='date' ? 'change' : 'input';
      inp.addEventListener(ev, () => {
        const f = inp.dataset.f, p = draft.positionen[i];
        if(f==='leistungId'){
          p.leistungId = inp.value;
          const l = S.leistungen.find(x => x.id===inp.value);
          if(l){ p.text = l.name; p.netto = l.netto; row.querySelector('[data-f="text"]').value = l.name; row.querySelector('[data-f="netto"]').value = numIn(l.netto); }
        } else if(f==='netto') p.netto = inp.value.trim()==='' ? '' : num(inp.value);
        else if(f==='menge') p.menge = inp.value.trim()==='' ? 1 : num(inp.value);
        else p[f] = inp.value;
        updatePreview();
      });
    });
  });
  updatePreview();
}
function draftKunde(){ return S.kunden.find(k => k.id===draft.kundeId) || {}; }
function updatePreview(){
  const pos = draft.positionen.filter(p => p.text || p.netto!=='');
  const t = totals(pos, S.settings.mwst);
  $('#dTotals').innerHTML = `<span class="muted">Netto</span><span>${eur(t.net)}</span><span class="muted">MwSt. ${S.settings.mwst} %</span><span>${eur(t.vat)}</span><span class="g">Gesamt</span><span class="g">${eur(t.total)}</span>`;
  $('#dCount').textContent = draft.positionen.length + ' von ' + MAXPOS + ' Zeilen';
  mountPaper($('#dPaper'), docHTML({
    preview:true, titel:CFG.docTitle, kunde:draftKunde(), mwst:S.settings.mwst, positionen:pos.length?pos:[{text:'',datum:'',netto:0}],
    angaben:[['Rechnungsangaben'],['Rechnungsnummer',peekNumber(draft.datum)],['Rechnungsdatum',dShort(draft.datum)]]
  }));
}
function saveDraft(){
  const err = $('#dErr'); err.textContent = '';
  const k = draftKunde();
  if(!k.id){ err.textContent = 'Bitte wählen Sie einen Kunden aus.'; $('#dKunde').focus(); return; }
  const pos = draft.positionen.filter(p => p.text || p.netto!=='');
  if(!pos.length){ err.textContent = 'Bitte tragen Sie mindestens eine Leistung ein.'; return; }
  const bad = pos.findIndex(p => !p.text || p.netto==='' || !p.datum);
  if(bad>-1){ err.textContent = `In Zeile ${bad+1} fehlt ${!pos[bad].text?'die Bezeichnung':(pos[bad].netto===''?'der Preis':'das Datum der Leistung')}.`; return; }
  const r = {
    id:uid(), typ:'rechnung', nr:takeNumber(draft.datum), datum:draft.datum, created:new Date().toISOString(),
    kundeId:k.id, kunde:{...k}, settings:{...S.settings}, mwst:S.settings.mwst, zahlungsziel:S.settings.zahlungsziel,
    positionen:pos.map(p => ({text:p.text, datum:p.datum, menge:num(p.menge||1), netto:num(p.netto)})),
    status:'offen', bezahltAm:null, mahnungen:[]
  };
  S.rechnungen.push(r); save();
  draft = null;
  toast('Rechnung ' + r.nr + ' erstellt');
  go('rechnungen');
  showDoc(rechnungDoc(r), 'Rechnung ' + r.nr, 'rechnung-' + r.nr);
}

/* ---------- Dialoge ---------- */

function openDlg(html, wide){ dlg.className = wide ? 'wide' : ''; dlg.innerHTML = html; dlg.showModal(); const f = dlg.querySelector('input:not([type=hidden]),select,button.primary'); if(f) f.focus(); }
function closeDlg(){ dlg.close(); }
dlg.addEventListener('click', e => { if(e.target===dlg) closeDlg(); });

function showDoc(html, title){
  openDlg(`<div class="dlg"><h2>${esc(title)}</h2><p class="hint" style="margin:0">Zum Speichern als PDF im Druckfenster „Als PDF sichern“ bzw. „Als PDF speichern“ wählen.</p>
    <div class="doc"><div class="paper" id="docPaper"></div></div>
    <div class="actions"><button class="btn" data-act="close">Schließen</button><button class="btn primary" data-act="print">Drucken oder als PDF sichern</button></div></div>`, true);
  mountPaper($('#docPaper'), html);
  dlg._doc = html;
}
function confirmDlg(title, text, okText, danger){
  return new Promise(res => {
    openDlg(`<div class="dlg"><h2>${esc(title)}</h2><p class="sub">${text}</p><div class="actions"><button class="btn" data-r="0">Abbrechen</button><button class="btn primary" data-r="1" ${danger?'style="background:var(--wine);border-color:var(--wine)"':''}>${esc(okText)}</button></div></div>`);
    dlg.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { closeDlg(); res(b.dataset.r==='1'); }));
    dlg.addEventListener('close', () => res(false), {once:true});
  });
}
function kundeDlg(k, after){
  const isNew = !k; k = k || {id:'', anrede:'Frau', vorname:'', nachname:'', firma:'', strasse:'', plzort:'', land:'', email:'', notiz:''};
  openDlg(`<form id="kForm"><h2>${isNew?'Kunden anlegen':'Kunden bearbeiten'}</h2><p class="hint" style="margin:0 0 16px">Änderungen gelten für neue Rechnungen. Bereits erstellte Rechnungen bleiben, wie sie sind.</p>
    <div class="grid2">
      <label class="f">Anrede<select name="anrede">${['Frau','Herr','–'].map(a=>`<option ${k.anrede===a?'selected':''}>${a}</option>`).join('')}</select></label>
      <label class="f">Firma (optional)<input name="firma" value="${esc(k.firma)}"></label>
      <label class="f">Vorname<input name="vorname" value="${esc(k.vorname)}" autocomplete="off"></label>
      <label class="f">Nachname<input name="nachname" value="${esc(k.nachname)}" autocomplete="off" required></label>
      <label class="f span2">Straße und Hausnummer<input name="strasse" value="${esc(k.strasse)}"></label>
      <label class="f">PLZ und Ort<input name="plzort" value="${esc(k.plzort)}" placeholder="z. B. D-54295 Trier"></label>
      <label class="f">Land (optional)<input name="land" value="${esc(k.land)}"></label>
      <label class="f span2">E-Mail (optional)<input name="email" type="email" value="${esc(k.email)}"></label>
      <label class="f span2">Notiz (nur für Sie, erscheint nicht auf der Rechnung)<textarea name="notiz">${esc(k.notiz)}</textarea></label>
    </div>
    <div class="actions"><button class="btn" type="button" data-act="close">Abbrechen</button><button class="btn primary" type="submit">${isNew?'Kunden anlegen':'Änderungen speichern'}</button></div></form>`, true);
  $('#kForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    Object.keys(fd).forEach(x => fd[x] = String(fd[x]).trim());
    if(isNew){ fd.id = uid(); S.kunden.push(fd); } else Object.assign(S.kunden.find(x=>x.id===k.id), fd);
    save(); closeDlg(); toast(isNew ? 'Kunde angelegt' : 'Änderungen gespeichert');
    after ? after(fd.id || k.id) : render();

function leistungDlg(l){
  const isNew = !l; l = l || {id:'', name:'', netto:''};
  const mw = S.settings.mwst;
  openDlg(`<form id="lForm"><h2>${isNew?'Leistung anlegen':'Leistung bearbeiten'}</h2><p class="hint" style="margin:0 0 16px">Geben Sie den Netto- oder den Bruttopreis ein, der andere wird berechnet.</p>
    <div class="grid2">
      <label class="f span2">Bezeichnung<input name="name" value="${esc(l.name)}" required></label>
      <label class="f">Preis netto<input name="netto" id="lNet" inputmode="decimal" value="${l.netto===''?'':numIn(l.netto)}" required></label>
      <label class="f">Preis brutto (inkl. ${mw} % MwSt.)<input id="lBrut" inputmode="decimal" value="${l.netto===''?'':numIn(r2(l.netto+r2(l.netto*mw/100)))}"></label>
    </div>
    <div class="actions"><button class="btn" type="button" data-act="close">Abbrechen</button><button class="btn primary" type="submit">${isNew?'Leistung anlegen':'Änderungen speichern'}</button></div></form>`);

  n.addEventListener('input', () => { const v=num(n.value); b.value = n.value.trim()?numIn(r2(v+r2(v*mw/100))):''; });

  $('#lForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = e.target.name.value.trim(), netto = r2(num(n.value));
    if(isNew) S.leistungen.push({id:uid(), name, netto}); else Object.assign(S.leistungen.find(x=>x.id===l.id), {name, netto});
    save(); closeDlg(); toast(isNew ? 'Leistung angelegt' : 'Änderungen gespeichert'); render();
  });
}
function paidDlg(r){
  openDlg(`<form id="pForm"><h2>Zahlung eintragen</h2><p class="sub">Rechnung ${esc(r.nr)} über ${eur(totals(r.positionen,r.mwst).total)}</p>
    <label class="f" style="margin-top:14px">Bezahlt am<input type="date" name="am" value="${today()}" required></label>
    <div class="actions"><button class="btn" type="button" data-act="close">Abbrechen</button><button class="btn primary" type="submit">Als bezahlt markieren</button></div></form>`);
  $('#pForm').addEventListener('submit', e => { e.preventDefault(); r.status='bezahlt'; r.bezahltAm=e.target.am.value; save(); closeDlg(); toast('Als bezahlt markiert'); render(); });
}

/* ---------- Automatische Sicherung ---------- */
const FS_OK = typeof window.showDirectoryPicker === 'function';
let dirHandle = null, autoState = FS_OK ? 'off' : 'unsupported', autoTimer = null;
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('app-' + KEY, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kv(mode, k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode==='get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');
    const rq = mode==='get' ? st.get(k) : mode==='set' ? st.put(v, k) : st.delete(k);
    tx.oncomplete = () => res(rq.result); tx.onerror = () => rej(tx.error);
  });
}
async function initAuto(){
  if(!FS_OK) return;
  try{ dirHandle = await kv('get', 'backupDir'); }catch(e){ dirHandle = null; }
  if(!dirHandle){ autoState = 'off'; return; }
  try{
    const p = await dirHandle.queryPermission({mode:'readwrite'});
    autoState = p==='granted' ? 'on' : 'needs-permission';
  }catch(e){ autoState = 'needs-permission'; }
  if(autoState==='on') writeAutoBackup();
}
async function chooseFolder(){
  try{
    const h = await window.showDirectoryPicker({id:'sicherung', mode:'readwrite', startIn:'documents'});
    dirHandle = h; await kv('set', 'backupDir', h); autoState = 'on';
    const ok = await writeAutoBackup();
    if(ok) toast('Automatische Sicherung eingerichtet: ' + h.name);
    render();
  }catch(e){ if(e.name!=='AbortError') toast('Der Ordner konnte nicht gewählt werden.'); }
}
async function resumeAuto(){
  if(!dirHandle) return chooseFolder();
  try{
    const p = await dirHandle.requestPermission({mode:'readwrite'});
    autoState = p==='granted' ? 'on' : 'needs-permission';
    if(autoState==='on' && await writeAutoBackup()) toast('Automatische Sicherung läuft wieder');
  }catch(e){ autoState = 'needs-permission'; }
  render();
}
async function stopAuto(){
  dirHandle = null; autoState = 'off';
  try{ await kv('del', 'backupDir'); }catch(e){}
  toast('Automatische Sicherung ausgeschaltet'); render();
}
function scheduleAuto(){
  if(autoState!=='on') return;
  clearTimeout(autoTimer); autoTimer = setTimeout(writeAutoBackup, 1200);
}
async function writeAutoBackup(){
  if(!dirHandle || autoState!=='on') return false;
  try{
    const now = new Date().toISOString();
    const data = JSON.stringify(Object.assign({}, S, {lastBackup:now, lastAutoBackup:now}), null, 2);
    for(const name of [CFG.filePrefix + '-Sicherung-' + today() + '.json', CFG.filePrefix + '-Sicherung-aktuell.json']){
      const fh = await dirHandle.getFileHandle(name, {create:true});
      const w = await fh.createWritable(); await w.write(data); await w.close();
    }
    S.lastBackup = now; S.lastAutoBackup = now; persist(); renderSide();
    return true;
  }catch(e){
    console.warn('Automatische Sicherung fehlgeschlagen', e);
    autoState = (e.name==='NotAllowedError' || e.name==='SecurityError') ? 'needs-permission' : 'error';
    renderSide(); return false;
  }
}
function autoPanel(){
  if(autoState==='unsupported') return `<p class="note" style="margin:0 0 6px">Automatisches Sichern funktioniert nur, wenn die App über Google Chrome oder Microsoft Edge geöffnet bzw. installiert wurde. Bitte bis dahin regelmäßig von Hand sichern.</p>`;
  const name = dirHandle ? esc(dirHandle.name) : '';
  if(autoState==='on') return `<p style="margin:0 0 10px">Automatisch aktiv${name ? ' im Ordner <strong style="font-weight:500">' + name + '</strong>' : ''}${S.lastAutoBackup ? ', zuletzt ' + whenTxt(S.lastAutoBackup) : ''}. Pro Tag entsteht eine Datei, dazu immer eine aktuelle.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="auto-choose">Anderen Ordner wählen</button><button class="btn danger" data-act="auto-stop">Ausschalten</button></div>`;
  if(autoState==='needs-permission') return `<p class="note" style="margin:0 0 10px">Die automatische Sicherung in <strong>${name}</strong> ist pausiert. Chrome fragt aus Sicherheitsgründen gelegentlich erneut nach.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="auto-resume">Sicherung freigeben</button><button class="btn" data-act="auto-choose">Anderen Ordner wählen</button></div>`;
  if(autoState==='error') return `<p class="note" style="margin:0 0 10px">Der Ordner <strong>${name}</strong> ist nicht erreichbar, vielleicht wurde er verschoben oder gelöscht.</p><button class="btn primary" data-act="auto-choose">Ordner neu wählen</button>`;
  return `<button class="btn primary" data-act="auto-choose">Sicherungsordner wählen und automatisch sichern</button>`;
}

/* ---------- Export ---------- */
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backup(){
  S.lastBackup = new Date().toISOString();
  download(CFG.filePrefix + '-Sicherung-' + today() + '.json', JSON.stringify(S, null, 2), 'application/json');
  save(); toast('Sicherung heruntergeladen');
}
function csv(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const n = v => numIn(v);
  const rows = [['Rechnungsnummer','Art','Rechnungsdatum','Kunde','Netto','MwSt-Satz','MwSt','Brutto','Status','Bezahlt am','Storno zu'].map(q).join(';')];
  S.rechnungen.slice().sort((a,b)=>(a.datum+a.created).localeCompare(b.datum+b.created)).forEach(r => {
    const t = totals(r.positionen, r.mwst, r.typ==='storno'?-1:1);
    rows.push([r.nr, r.typ==='storno'?'Stornorechnung':'Rechnung', dLong(r.datum), kundeName(r.kunde), n(t.net), String(r.mwst).replace('.',','), n(t.vat), n(t.total), STATUS_TXT[status(r)], r.bezahltAm?dLong(r.bezahltAm):'', r.stornoVon||''].map(q).join(';'));
  });
  download(CFG.filePrefix + '-Rechnungen-' + today() + '.csv', '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
}
function restoreFile(e){
  const file = e.target.files[0]; if(!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || !Array.isArray(d.rechnungen) || !Array.isArray(d.kunden)) throw new Error('format');
      const ok = await confirmDlg('Sicherung einspielen?', `Die Sicherung enthält ${d.kunden.length} Kunden und ${d.rechnungen.length} Rechnungen. Die aktuellen Daten in diesem Browser werden dadurch ersetzt.`, 'Sicherung einspielen', true);
      if(!ok) return;
      S = Object.assign(defaults(), d); S.settings = Object.assign(defaults().settings, d.settings||{});
      save(); toast('Sicherung eingespielt'); go('start');
    }catch(err){ toast('Diese Datei ist keine gültige Sicherung.'); }
    e.target.value = '';
  };
  fr.readAsText(file);
}

/* ---------- Aktionen ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if(g){ go(g.dataset.go); return; }
  const nv = e.target.closest('#nav button[data-view]');
  if(nv){ go(nv.dataset.view); return; }
  const fb = e.target.closest('[data-filter]');
  if(fb){ rFilter = fb.dataset.filter; $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b===fb)); renderRList(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const r = id ? S.rechnungen.find(x => x.id===id) : null;
  switch(act){
    case 'close': closeDlg(); break;
    case 'print': printHTML(dlg._doc); break;
    case 'backup': backup(); break;
    case 'auto-choose': chooseFolder(); break;
    case 'auto-resume': resumeAuto(); break;
    case 'auto-stop': stopAuto(); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'csv': csv(); break;
    case 'kunde-neu': kundeDlg(null); break;
    case 'kunde-neu-draft': kundeDlg(null, nid => { draft.kundeId = nid; render(); }); break;
    case 'kunde-edit': kundeDlg(S.kunden.find(k => k.id===id)); break;
    case 'kunde-rechnung': draft = null; go('neu', {kundeId:id}); break;
    case 'kunde-del': {
      const k = S.kunden.find(x => x.id===id);
      if(await confirmDlg('Kunden löschen?', `${esc(kundeName(k))} wird aus der Kundenliste entfernt. Bereits erstellte Rechnungen bleiben vollständig erhalten.`, 'Kunden löschen', true)){
        S.kunden = S.kunden.filter(x => x.id!==id); save(); toast('Kunde gelöscht'); render();
      } break; }
    case 'leistung-neu': leistungDlg(null); break;
    case 'leistung-edit': leistungDlg(S.leistungen.find(l => l.id===id)); break;
    case 'leistung-del': {
      const l = S.leistungen.find(x => x.id===id);
      if(await confirmDlg('Leistung löschen?', `„${esc(l.name)}“ wird aus der Liste entfernt. Bereits erstellte Rechnungen bleiben unverändert.`, 'Leistung löschen', true)){
        S.leistungen = S.leistungen.filter(x => x.id!==id); save(); toast('Leistung gelöscht'); render();
      } break; }
    case 'pos-add':
      if(draft.positionen.length >= MAXPOS){ $('#dErr').textContent = `Auf eine Seite passen höchstens ${MAXPOS} Leistungen. Für mehr bitte eine zweite Rechnung schreiben.`; break; }
      { const l = S.leistungen.length===1 ? S.leistungen[0] : null;
        draft.positionen.push({leistungId:l?l.id:'', text:l?l.name:'', netto:l?l.netto:'', menge:1, datum:draft.datum}); }
      renderPos(); break;
    case 'pos-del': draft.positionen.splice(Number(b.dataset.i),1); renderPos(); break;
    case 'draft-save': saveDraft(); break;
    case 'draft-reset':
      if(await confirmDlg('Entwurf verwerfen?', 'Die Eingaben dieser Rechnung werden gelöscht.', 'Verwerfen', true)){ draft = null; render(); } break;
    case 'show': showDoc(rechnungDoc(r), (r.typ==='storno'?'Stornorechnung ':'Rechnung ') + r.nr); break;
    case 'paid': paidDlg(r); break;
    case 'unpaid': r.status='offen'; r.bezahltAm=null; save(); toast('Zahlung zurückgenommen'); render(); break;
    case 'copy': draft = null; go('neu', {reset:true, from:r}); toast('Neue Rechnung mit denselben Angaben vorbereitet'); break;
    case 'remind': {
      const n = (r.mahnungen||[]).length + 1;
      if(await confirmDlg('Zahlungserinnerung erstellen?', `Für Rechnung ${esc(r.nr)} wird eine ${n}. Zahlungserinnerung mit heutigem Datum erstellt. Die neue Zahlungsfrist beträgt ${S.settings.mahnfrist} Tage.`, 'Erinnerung erstellen')){
        r.mahnungen = r.mahnungen || []; const d = today(); r.mahnungen.push(d); save(); render();
        showDoc(mahnungDoc(r, d, n), n + '. Zahlungserinnerung zu ' + r.nr);
      } break; }
    case 'storno': {
      if(await confirmDlg('Rechnung stornieren?', `Für Rechnung ${esc(r.nr)} wird eine Stornorechnung mit eigener Nummer erstellt, die den Betrag vollständig aufhebt. Das lässt sich nicht rückgängig machen.`, 'Stornieren', true)){
        const d = today();
        const s = {id:uid(), typ:'storno', nr:takeNumber(d), datum:d, created:new Date().toISOString(), kundeId:r.kundeId, kunde:{...r.kunde}, settings:{...r.settings},
          mwst:r.mwst, zahlungsziel:r.zahlungsziel, positionen:r.positionen.map(p=>({...p})), stornoVon:r.nr, stornoVonDatum:r.datum, status:'storno', mahnungen:[]};
        r.status='storniert'; r.stornoNr=s.nr; S.rechnungen.push(s); save(); render();
        showDoc(rechnungDoc(s), 'Stornorechnung ' + s.nr);
      } break; }
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='rSearch'){ rSearch = e.target.value; renderRList(); }
  if(e.target.id==='kSearch'){ kSearch = e.target.value; renderKList(); }
});
